name: ContextForge checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m py_compile ctx.py
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n install.sh
