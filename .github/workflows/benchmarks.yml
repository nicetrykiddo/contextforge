name: Offline memory benchmarks (NO LLM inference)
on:
  push:
    paths:
      - 'benchmarks/**'
      - 'ctx.py'
      - 'contextforge_reasoning.py'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'ctx.py'
      - 'contextforge_reasoning.py'
      - '.github/workflows/benchmarks.yml'
jobs:
  offline-memory:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m py_compile benchmarks/offline_recovery.py benchmarks/live_codex.py benchmarks/scale.py
      - name: Cold-process recovery and latency benchmark (no model)
        run: python3 benchmarks/offline_recovery.py --noise 48 --replays 12 --output .bench-results/offline.json
      - name: Large ledger scaling (100 to 20,000 records; no model)
        run: python3 benchmarks/scale.py --sizes 100,1000,5000,20000 --trials 7 --output .bench-results/scale.json
      - name: Validate Codex runner dry-run cannot spend model usage
        run: python3 benchmarks/live_codex.py --model gpt-6-sol --seeds 1 --arms cold-plain,cold-forge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-memory-python-${{ matrix.python-version }}
          path: |
            .bench-results/offline.json
            .bench-results/scale.json
          if-no-files-found: warn
